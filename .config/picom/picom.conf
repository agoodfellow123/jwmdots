backend = "glx";
vsync = true;
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = true;
blur: {
    method = "dual_kawase";
    strength = 10;
    background = true;
    background-frame = true;
    background-fixed = true;
};
opacity-rule = [
    "85:class_g = 'Alacritty'",
];
