yellow = "#EFB41B"

fg = "#B6BFBC"
fg_1 = "#A0A8A5"
fg_2 = "#969E9B"
fg_3 = "#838A87"
fg_4 = "#4C5955"
fg_err = "#C27280"
fg_warn = "#B8A26C"
fg_info = "#6C94B8"
fg_hint = "#32878F"
fg_primary = "#12B27D"
fg_secondary = "#6797C2"
fg_tertiary = "#9C59B2"
fg_primary_variant = "#0F996B"
fg_secondary_variant = "#526B82"
fg_tertiary_variant = "#945EA6"

rnb_1 = "#00CCCC"
rnb_2 = "#BF568B"
rnb_3 = "#00CC66"
rnb_4 = "#CC5F29"
rnb_5 = "#B4CC3D"

bg = "#00120C"
bg_1 = "#001F14"
bg_2 = "#001C13"
bg_3 = "#002E1F"
bg_4 = "#003624"
bg_err = "#382125"
